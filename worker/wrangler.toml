# Cloudflare Worker backend for https://nastya-star.github.io/munich-fuel-min/
# Deploy: see ../README.md. The API key is a secret (wrangler secret put TANKERKOENIG_API_KEY),
# never a [vars] entry.
name = "munich-fuel-min"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://nastya-star.github.io"

# One global Durable Object coordinates every upstream request (1 per minute for the key).
[[durable_objects.bindings]]
name = "PRICE_GATE"
class_name = "PriceGate"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PriceGate"]

# Per-client edge rate limit (Workers rate limiting; approximate, counted per Cloudflare location).
# Requests over the limit get 429 before reaching the Durable Object. Optional: handler.js works
# without it. The strict per-client upstream budget lives in gate.js.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
